# ============================================================
# 抖音评论分析与可视化平台 —— 一键容器化部署
#
#   docker compose up -d --build
#
# 服务拓扑：
#   frontend(:80)  ->  nginx 托管前端 + 反代 /api
#   backend(:8080)  ->  Spring Boot，内置 Python/Chrome 供爬虫调用
#   flask(:5000)    ->  分词服务 + DeepSeek AI 话题分析
#   mysql(:3306)   ->  数据存储
# ============================================================

name: coolpilot-insight

services:

  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: cpi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-coolpilot_insight}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 注意：不再挂载 initdb 建表脚本。
      # 表结构由 Flyway 独占管理（ADR-001），MySQL 只负责创建空库。
    ports:
      # 本机 3306 已被占用，映射到 3307 避免冲突
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - cpi-net

  # ---------------- Flask 分词/AI 服务 ----------------
  flask:
    build:
      context: .
      dockerfile: docker/flask.Dockerfile
    container_name: cpi-flask
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-coolpilot_insight}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      # 可选：DeepSeek API Key，未配置则 AI 分析自动降级为统计报告
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 服务间认证：Java 调用时必须带 X-Internal-Token，留空则不校验（仅本地开发）
      FLASK_INTERNAL_TOKEN: ${FLASK_INTERNAL_TOKEN:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # 使用 /health 而非业务端点：业务端点要求 X-Internal-Token
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=10)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cpi-net

  # ---------------- Spring Boot 后端 ----------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: cpi-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-coolpilot_insight}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未配置，请在 .env 中设置随机字符串（openssl rand -hex 32）}
      # 首次启动用于把哨兵管理员置为可用密码；留空则管理员保持禁用
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
      # 服务间调用令牌（Flask 拒绝无此头的请求）
      FLASK_INTERNAL_TOKEN: ${FLASK_INTERNAL_TOKEN:-}
      # 容器内固定路径
      APP_PROJECT_ROOT: /app
      PYTHON_EXE: /opt/venv/bin/python
      PY_DATA_DIR: /app/Py_Data
      PY_CLEAN_DIR: /app/Py_Data/clean
      PY_DATAS_DIR: /app/Py_Data/Datas
      # Flask 由独立容器提供，无需本进程拉起
      FLASK_BASE_URL: http://flask:5000
      FLASK_AUTOSTART: "false"
      # 容器内 Chrome 无 GUI，需 headless
      CHROME_HEADLESS: "1"
      CHROME_BROWSER_PATH: /usr/bin/google-chrome
      CHROME_USER_DATA_DIR: /app/chrome-data
      CHROME_NO_SANDBOX: "1"
      TZ: Asia/Shanghai
    volumes:
      # 采集的 CSV 持久化，容器重建不丢数据
      - ./Py_Data/Datas:/app/Py_Data/Datas
      # Chrome 用户数据目录，保留登录态
      - chrome-data:/app/chrome-data
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      flask:
        condition: service_started
    healthcheck:
      # 公开健康端点，不依赖登录 Token
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - cpi-net

  # ---------------- 前端 ----------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: cpi-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      # 本机 3000 已被占用，映射到 5173
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - cpi-net

volumes:
  mysql-data:
  chrome-data:

networks:
  cpi-net:
    driver: bridge
