# ============================================================
# 抖音评论分析与可视化平台 —— 一键容器化部署
#
#   docker compose up -d --build
#
# 服务拓扑：
#   frontend(:80)  ->  nginx 托管前端 + 反代 /api
#   backend(:8080)  ->  Spring Boot，内置 Python/Chrome 供爬虫调用
#   flask(:5000)    ->  分词服务 + DeepSeek AI 话题分析
#   mysql(:3306)   ->  数据存储
# ============================================================

name: dy-comment

services:

  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: dy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-dy_comment}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建库建表脚本
      - ./dy_comment.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 本机 3306 已被占用，映射到 3307 避免冲突
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - dy-net

  # ---------------- Flask 分词/AI 服务 ----------------
  flask:
    build:
      context: .
      dockerfile: docker/flask.Dockerfile
    container_name: dy-flask
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-dy_comment}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      # 可选：DeepSeek API Key，未配置则 AI 分析自动降级为统计报告
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/wordcloud?video_id=__health__',timeout=10)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - dy-net

  # ---------------- Spring Boot 后端 ----------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: dy-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-dy_comment}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dy_comment_jwt_secret_key_2026}
      # 容器内固定路径
      APP_PROJECT_ROOT: /app
      PYTHON_EXE: /opt/venv/bin/python
      PY_DATA_DIR: /app/Py_Data
      PY_CLEAN_DIR: /app/Py_Data/clean
      PY_DATAS_DIR: /app/Py_Data/Datas
      # Flask 由独立容器提供，无需本进程拉起
      FLASK_BASE_URL: http://flask:5000
      FLASK_AUTOSTART: "false"
      # 容器内 Chrome 无 GUI，需 headless
      CHROME_HEADLESS: "1"
      CHROME_BROWSER_PATH: /usr/bin/google-chrome
      CHROME_USER_DATA_DIR: /app/chrome-data
      CHROME_NO_SANDBOX: "1"
      TZ: Asia/Shanghai
    volumes:
      # 采集的 CSV 持久化，容器重建不丢数据
      - ./Py_Data/Datas:/app/Py_Data/Datas
      # Chrome 用户数据目录，保留登录态
      - chrome-data:/app/chrome-data
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      flask:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/analysis/summary?video_id=__health__ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - dy-net

  # ---------------- 前端 ----------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: dy-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      # 本机 3000 已被占用，映射到 5173
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - dy-net

volumes:
  mysql-data:
  chrome-data:

networks:
  dy-net:
    driver: bridge
